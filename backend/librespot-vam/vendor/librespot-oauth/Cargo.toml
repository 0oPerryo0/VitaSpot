[package]
edition = "2024"
rust-version = "1.85"
name = "librespot-oauth"
version = "0.8.0"
authors = ["Nick Steel <nick@nsteel.co.uk>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "OAuth authorization code flow with PKCE for obtaining a Spotify access token"
readme = false
license = "MIT"
repository = "https://github.com/librespot-org/librespot"

[features]
__rustls = []
default = ["native-tls"]
native-tls = [
    "oauth2/native-tls",
    "reqwest/native-tls",
]
rustls-tls-native-roots = [
    "__rustls",
    "oauth2/rustls-tls",
    "reqwest/rustls-tls-native-roots",
]
rustls-tls-webpki-roots = [
    "__rustls",
    "oauth2/rustls-tls",
    "reqwest/rustls-tls-webpki-roots",
]

[lib]
name = "librespot_oauth"
path = "src/lib.rs"

[[example]]
name = "oauth_async"
path = "examples/oauth_async.rs"

[[example]]
name = "oauth_sync"
path = "examples/oauth_sync.rs"

[dependencies.log]
version = "0.4"

[dependencies.oauth2]
version = "5.0"
features = [
    "reqwest",
    "reqwest-blocking",
]
default-features = false

[target.'cfg(not(target_os = "vita"))'.dependencies.open]
version = "5.3"

[dependencies.reqwest]
version = "0.12"
features = ["system-proxy"]
default-features = false

[dependencies.thiserror]
version = "2"

[dependencies.url]
version = "2.5"

[dev-dependencies.env_logger]
version = "0.11"
features = [
    "color",
    "humantime",
    "auto-color",
]
default-features = false

[dev-dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "macros",
]
